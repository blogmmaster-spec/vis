name: Build image worker

# Builds workers/ and pushes it to GHCR, so neither the build nor the image upload touches
# a local machine or a slow uplink.
#
# BAKE_WEIGHTS=0 on purpose: a baked image is ~20GB, which does not fit a GitHub-hosted
# runner's ~14GB free disk. Slim is ~8GB, and the 13GB of weights download inside RunPod's
# data center on first boot instead — their network, not yours.
#
# GIT_SHA is stamped into the image so every boot can log which commit it is actually running.

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - ".github/workflows/image-worker.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vis-worker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Runners ship with several GB of preinstalled toolchains we do not need. Reclaiming
      # them is what makes an ~8GB image build fit.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: workers
          push: true
          build-args: |
            BAKE_WEIGHTS=0
            GIT_SHA=${{ github.sha }}
          # `latest` is what RunPod pulls; the SHA tag lets you pin or roll back.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed ${{ env.IMAGE }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Use in RunPod: \`${{ env.IMAGE }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Make the package public (Packages → package → settings) or add registry" >> "$GITHUB_STEP_SUMMARY"
          echo "credentials to the endpoint — GHCR defaults to private." >> "$GITHUB_STEP_SUMMARY"
